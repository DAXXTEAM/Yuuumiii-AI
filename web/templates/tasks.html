<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Yuuumiii - Tasks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#040810;--cyan:#00e5ff;--green:#00ff88;--red:#ff1744;--yellow:#ffd600;--dim:#3a6a80;--text:#b0d8e8;--card:rgba(0,20,40,.6)}
body{font-family:"Courier New",monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.hdr{padding:10px 20px;border-bottom:1px solid rgba(0,229,255,.12);display:flex;justify-content:space-between;align-items:center;position:relative}
.hdr::after{content:"";position:absolute;bottom:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scanX 4s linear infinite}
.hdr-l h1{font-size:1.3rem;letter-spacing:8px;color:var(--cyan);text-shadow:0 0 18px rgba(0,229,255,.5);font-weight:400}
.hdr-l .sub{font-size:.6rem;color:var(--dim);letter-spacing:3px;margin-top:2px}
.hdr-r{display:flex;align-items:center;gap:12px}
.btn{padding:5px 12px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);font-family:inherit;font-size:.65rem;cursor:pointer;letter-spacing:1px;transition:all .2s;border-radius:2px;text-decoration:none}
.btn:hover{background:rgba(0,229,255,.08)}
.btn-home{border-color:var(--dim);color:var(--dim)}
.btn-home:hover{border-color:var(--cyan);color:var(--cyan)}
.container{flex:1;padding:20px;max-width:900px;margin:0 auto;width:100%}
.section-title{font-size:.7rem;letter-spacing:3px;color:var(--cyan);margin-bottom:15px;padding-bottom:5px;border-bottom:1px solid rgba(0,229,255,.15)}
.new-task{display:flex;gap:10px;margin-bottom:25px}
.new-task input{flex:1;background:rgba(0,20,40,.5);border:1px solid rgba(0,229,255,.18);color:var(--text);font-family:inherit;font-size:.8rem;padding:10px 14px;border-radius:2px;outline:none}
.new-task input:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(0,229,255,.12)}
.new-task button{padding:10px 20px;border:1px solid var(--green);background:transparent;color:var(--green);font-family:inherit;font-size:.7rem;cursor:pointer;letter-spacing:2px;border-radius:2px}
.new-task button:hover{background:rgba(0,255,136,.08)}
.task-list{display:flex;flex-direction:column;gap:12px}
.task-card{border:1px solid rgba(0,229,255,.14);background:var(--card);padding:14px 16px;border-radius:2px;position:relative}
.task-card::before,.task-card::after{content:"";position:absolute;width:8px;height:8px;border-style:solid;opacity:.5}
.task-card::before{top:-1px;left:-1px;border-width:1px 0 0 1px;border-color:var(--cyan)}
.task-card::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0;border-color:var(--cyan)}
.task-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.task-title{font-size:.8rem;color:var(--text)}
.task-id{font-size:.6rem;color:var(--dim);letter-spacing:1px}
.badge{font-size:.58rem;padding:2px 8px;border-radius:2px;letter-spacing:1px;font-weight:bold}
.badge-pending{border:1px solid var(--dim);color:var(--dim)}
.badge-running{border:1px solid var(--cyan);color:var(--cyan);animation:blink 1.5s infinite}
.badge-done{border:1px solid var(--green);color:var(--green)}
.badge-failed{border:1px solid var(--red);color:var(--red)}
.progress-bar{height:3px;background:rgba(0,229,255,.1);border-radius:2px;margin:8px 0;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .5s ease}
.task-logs{margin-top:8px;max-height:120px;overflow-y:auto;font-size:.68rem;color:var(--dim);line-height:1.6;padding:6px 8px;background:rgba(0,0,0,.3);border-radius:2px;display:none}
.task-logs.open{display:block}
.task-logs::-webkit-scrollbar{width:2px}
.task-logs::-webkit-scrollbar-thumb{background:var(--dim)}
.log-line{border-bottom:1px solid rgba(0,229,255,.05);padding:2px 0}
.task-result{margin-top:8px;font-size:.72rem;color:var(--green);padding:8px;background:rgba(0,255,136,.03);border:1px solid rgba(0,255,136,.15);border-radius:2px;white-space:pre-wrap;max-height:150px;overflow-y:auto;display:none}
.task-result.open{display:block}
.task-actions{display:flex;gap:8px;margin-top:8px}
.btn-sm{font-size:.6rem;padding:3px 8px;border:1px solid var(--dim);color:var(--dim);background:transparent;cursor:pointer;border-radius:2px;letter-spacing:1px}
.btn-sm:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-cancel{border-color:var(--red);color:var(--red)}
.btn-cancel:hover{background:rgba(255,23,68,.08)}
.empty-state{text-align:center;padding:40px;color:var(--dim);font-size:.8rem}
.refresh-note{font-size:.58rem;color:var(--dim);letter-spacing:1px;text-align:right;margin-bottom:10px}
@keyframes scanX{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.task-card{animation:fadeIn .3s ease}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-l">
    <h1>Y U U U M I I I</h1>
    <div class="sub">BACKGROUND TASKS &nbsp;|&nbsp; TASK MONITOR</div>
  </div>
  <div class="hdr-r">
    <a href="/" class="btn btn-home">HOME</a>
    <span class="btn" id="taskCount">0 TASKS</span>
  </div>
</div>
<div class="container">
  <div class="new-task">
    <input type="text" id="taskInput" placeholder="New task... e.g. disk space check karo aur report do" onkeydown="if(event.key==='Enter')createTask()">
    <button onclick="createTask()">CREATE TASK</button>
  </div>
  <div class="refresh-note">Auto-refresh: 3s</div>
  <div class="section-title">TASK QUEUE</div>
  <div class="task-list" id="taskList">
    <div class="empty-state">No tasks yet. Create one above.</div>
  </div>
</div>
<script>
let refreshInterval;

async function createTask(){
  const inp=document.getElementById('taskInput');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  try{
    const r=await fetch('/task/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:text})});
    if(r.ok){const d=await r.json();loadTasks();}
  }catch(e){console.error(e);}
}

async function loadTasks(){
  try{
    const r=await fetch('/task/status');
    if(!r.ok)return;
    const tasks=await r.json();
    document.getElementById('taskCount').textContent=tasks.length+' TASKS';
    const list=document.getElementById('taskList');
    if(tasks.length===0){
      list.innerHTML='<div class="empty-state">No tasks yet. Create one above.</div>';
      return;
    }
    list.innerHTML=tasks.map(t=>renderTask(t)).join('');
  }catch(e){console.error(e);}
}

function renderTask(t){
  const badge=`<span class="badge badge-${t.status}">${t.status.toUpperCase()}</span>`;
  const time=new Date(t.created_at*1000).toLocaleString();
  const logs=t.logs&&t.logs.length?t.logs.map(l=>`<div class="log-line">${escHtml(l)}</div>`).join(''):'<div class="log-line">No logs yet</div>';
  const result=t.result?`<div class="task-result" id="result-${t.id}">${escHtml(t.result)}</div>`:'';
  const cancelBtn=t.status==='running'||t.status==='pending'?`<button class="btn-sm btn-cancel" onclick="cancelTask('${t.id}')">CANCEL</button>`:'';
  
  return `<div class="task-card">
    <div class="task-header">
      <div>
        <div class="task-title">${escHtml(t.title)}</div>
        <div class="task-id">ID: ${t.id} | ${time}</div>
      </div>
      ${badge}
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${t.progress}%"></div></div>
    <div class="task-actions">
      <button class="btn-sm" onclick="toggleLogs('${t.id}')">LOGS</button>
      ${t.result?`<button class="btn-sm" onclick="toggleResult('${t.id}')">RESULT</button>`:''}
      ${cancelBtn}
    </div>
    <div class="task-logs" id="logs-${t.id}">${logs}</div>
    ${result}
  </div>`;
}

function escHtml(s){
  if(!s)return'';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleLogs(id){
  const el=document.getElementById('logs-'+id);
  if(el)el.classList.toggle('open');
}

function toggleResult(id){
  const el=document.getElementById('result-'+id);
  if(el)el.classList.toggle('open');
}

async function cancelTask(id){
  try{
    await fetch('/task/'+id+'/cancel',{method:'POST'});
    loadTasks();
  }catch(e){}
}

// Initial load + auto-refresh
loadTasks();
refreshInterval=setInterval(loadTasks,3000);
</script>
</body>
</html>
